<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nytvir Motion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root {
  --bg: #141416; --panel: #1c1c1f; --card: #222226;
  --border: #2e2e33; --accent: #7c5cfc; --accent2: #fc5c7d;
  --gold: #f5a623; --text: #e0e0e8; --muted: #666680;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; user-select: none; }

/* SIDEBAR */
.sidebar { width: 70px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 2px; overflow-y: auto; }
.sidebar::-webkit-scrollbar { width: 0; }
.logo { font-size: 20px; margin-bottom: 8px; }
.nav { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 9px 0; cursor: pointer; color: var(--muted); border-left: 2px solid transparent; transition: all .2s; }
.nav:hover { color: var(--text); background: rgba(255,255,255,.04); }
.nav.active { color: var(--accent); border-left-color: var(--accent); background: rgba(124,92,252,.08); }
.nav .ic { font-size: 19px; margin-bottom: 3px; }
.nav .lb { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.sep { width: 36px; height: 1px; background: var(--border); margin: 6px 0; flex-shrink: 0; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { height: 46px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; flex-shrink: 0; gap: 8px; }
.topbar-title { font-size: 13px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 9px; background: var(--accent); color: #fff; padding: 2px 7px; border-radius: 20px; font-weight: 700; flex-shrink: 0; }

/* SEARCH */
.searchwrap { padding: 10px 14px 0; flex-shrink: 0; }
.searchwrap input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: inherit; font-size: 11px; padding: 8px 12px; outline: none; transition: border-color .2s; }
.searchwrap input:focus { border-color: var(--accent); }
.searchwrap input::placeholder { color: var(--muted); }

.content { flex: 1; overflow-y: auto; padding: 14px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

/* CARDS */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: all .2s; position: relative; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,92,252,.15); }
.thumb { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 28px; position: relative; }
.play-hint { position: absolute; inset: 0; background: rgba(124,92,252,.2); display: flex; align-items: center; justify-content: center; opacity: 0; transition: .2s; }
.card:hover .play-hint { opacity: 1; }
.apply-btn { background: var(--accent); color: #fff; padding: 5px 14px; border-radius: 5px; font-size: 10px; font-weight: 700; border: none; cursor: pointer; letter-spacing: .5px; }
.cinfo { padding: 10px; }
.ctitle { font-size: 11px; font-weight: 700; color: #fff; margin-bottom: 2px; }
.cdesc { font-size: 9px; color: var(--muted); }
.fav { position: absolute; top: 5px; right: 7px; z-index: 2; font-size: 13px; color: rgba(255,255,255,.45); cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,.6); transition: transform .15s, color .15s; }
.fav:hover { transform: scale(1.25); color: var(--gold); }
.fav.on { color: var(--gold); }
.tab-chip { position: absolute; top: 6px; left: 7px; z-index: 2; font-size: 7px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; background: rgba(0,0,0,.45); color: #ccc; padding: 2px 6px; border-radius: 8px; }

.lchips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
.lchip { font-size: 9px; font-weight: 700; padding: 4px 9px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
.lchip:hover { color: var(--text); }
.lchip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.lchip.t { font-weight: 600; padding: 3px 8px; }
.lcount { font-size: 9px; color: var(--muted); margin: 4px 0 2px; }
.lthumb { height: 118px; background: #2a2a2e; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.lthumb img { max-width: 92%; max-height: 108px; border-radius: 6px; }
.lnum { position: absolute; left: 6px; bottom: 5px; font-size: 8px; font-weight: 800; color: #fff; background: rgba(0,0,0,.5); padding: 1px 5px; border-radius: 6px; z-index: 1; }
.ltags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px; }
.ltags span { font-size: 7.5px; color: #aab; background: #2c2c32; padding: 1px 5px; border-radius: 5px; }
/* SECTION LABEL */
.sec-label { font-size: 9px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin: 14px 0 8px; }
.sec-label:first-child { margin-top: 0; }

/* STATUS */
.statusbar { height: 26px; background: var(--accent); display: flex; align-items: center; padding: 0 12px; font-size: 10px; font-weight: 600; color: #fff; transition: background .3s; flex-shrink: 0; white-space: nowrap; overflow: hidden; }

/* EDIT PANEL */
#edit-content { display: flex; flex-direction: column; gap: 12px; }
.edit-header { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
.edit-layer-name { font-size: 11px; font-weight: 700; color: var(--accent); }
.edit-refresh { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 9px; padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: .2s; font-family: inherit; }
.edit-refresh:hover { border-color: var(--accent); color: var(--accent); }
.ctrl-num { width: 100%; background: #0d0d12; border: 1px solid var(--border); color: var(--accent); font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 6px; font-family: inherit; outline: none; }
.ctrl-num:focus { border-color: var(--accent); }

.ctrl-block { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 13px; }
.ctrl-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ctrl-name { font-size: 11px; font-weight: 600; color: var(--text); }
.ctrl-val { font-size: 11px; font-weight: 700; color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 4px; }
input[type=color] { width: 100%; height: 36px; border: none; background: transparent; cursor: pointer; border-radius: 6px; }

/* CURVE SELECTOR */
.curve-title { font-size: 11px; font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.curves-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.curve-card { border: 2px solid var(--border); border-radius: 7px; padding: 10px 8px 7px; cursor: pointer; text-align: center; transition: all .15s; background: var(--bg); }
.curve-card:hover { border-color: #555; }
.curve-card.active { background: #111; }
.curve-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-top: 6px; }
.curve-card.active .curve-lbl { color: #fff; }

/* GRAPH (J-FLOW) THUMB */
.jthumb { height: 70px; display: flex; align-items: center; justify-content: center; background: var(--bg); position: relative; }

/* EMPTY STATE */
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-icon { font-size: 36px; margin-bottom: 12px; }
.empty-text { font-size: 11px; line-height: 1.6; }

/* FOOTER VERSION */
.foot { text-align: center; font-size: 8px; color: var(--muted); padding: 16px 0 4px; letter-spacing: 1px; }

/* CAPTION STUDIO */
.cap-wrap { display: flex; flex-direction: column; gap: 12px; }
.cap-block { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 13px; }
.cap-label { font-size: 9px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 9px; }
.cap-langs { display: flex; gap: 8px; }
.cap-lang { flex: 1; text-align: center; padding: 9px 0; border: 1.5px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted); transition: all .15s; }
.cap-lang.on { border-color: var(--accent); color: #fff; background: rgba(124,92,252,.14); }
.cap-styles { display: flex; flex-direction: column; gap: 8px; }
.cap-style { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--border); border-radius: 9px; padding: 8px; cursor: pointer; transition: all .15s; background: var(--bg); }
.cap-style.on { border-color: var(--accent); background: rgba(124,92,252,.1); }
.cap-prev { width: 108px; height: 52px; border-radius: 6px; background: #08080c; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
.cap-style-info { min-width: 0; }
.cap-style-name { font-size: 11.5px; font-weight: 700; color: #fff; }
.cap-style-desc { font-size: 9px; color: var(--muted); margin-top: 2px; }
@keyframes capPop { 0%,12% { transform: scale(.6); opacity: 0; } 22% { transform: scale(1.07); opacity: 1; } 30%, 78% { transform: scale(1); opacity: 1; } 90%, 100% { transform: scale(1); opacity: 0; } }
.pv-tiktok { font-family: Inter, sans-serif; font-weight: 800; font-size: 13px; color: #fff; -webkit-text-stroke: .6px #05070f; text-shadow: 0 2px 5px rgba(0,0,0,.8); animation: capPop 2.6s infinite; }
@keyframes capSerif { 0% { opacity: 0; filter: blur(5px); letter-spacing: 1px; } 35%, 75% { opacity: 1; filter: blur(0); letter-spacing: 2.5px; } 100% { opacity: 0; filter: blur(4px); } }
.pv-serif { font-family: Georgia, serif; font-style: italic; font-size: 12.5px; color: #fff; text-shadow: 0 0 9px rgba(255,255,255,.8); animation: capSerif 3.2s infinite; }
.pv-reveal { font-family: Inter, sans-serif; font-weight: 600; font-size: 12px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
.pv-reveal span { opacity: .12; animation: capWord 3s infinite; }
.pv-reveal span:nth-child(2) { animation-delay: .5s; }
.pv-reveal span:nth-child(3) { animation-delay: 1s; }
@keyframes capWord { 0% { opacity: .12; } 15%, 80% { opacity: 1; } 95%, 100% { opacity: .12; } }
.pv-ramp { font-family: Inter, sans-serif; font-weight: 700; font-size: 12px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
.pv-ramp span { display: inline-block; opacity: 0; animation: capRamp 3s infinite; }
.pv-ramp span:nth-child(2) { animation-delay: .35s; }
.pv-ramp span:nth-child(3) { animation-delay: .7s; }
@keyframes capRamp { 0% { opacity: 0; transform: translateY(12px); } 20%, 78% { opacity: 1; transform: translateY(0); } 92%, 100% { opacity: 0; transform: translateY(12px); } }
.cap-opts { display: flex; gap: 8px; }
.cap-opt-col { flex: 1; }
.cap-chips { display: flex; gap: 5px; }
.cap-chip { flex: 1; text-align: center; padding: 7px 0; border: 1.5px solid var(--border); border-radius: 7px; font-size: 10px; font-weight: 700; cursor: pointer; color: var(--muted); transition: all .15s; }
.cap-chip.on { border-color: var(--accent); color: #fff; background: rgba(124,92,252,.14); }
.cap-run { width: 100%; border: none; border-radius: 10px; padding: 14px 0; font-family: inherit; font-size: 13px; font-weight: 800; letter-spacing: .5px; cursor: pointer; color: #fff; background: linear-gradient(135deg, #7c5cfc, #fc5c7d); transition: transform .12s, opacity .2s; }
.cap-run:hover { transform: translateY(-1px); }
.cap-run:disabled { opacity: .55; cursor: wait; transform: none; }
.cap-srt { width: 100%; border: 1.5px solid var(--border); background: transparent; border-radius: 10px; padding: 10px 0; font-family: inherit; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; margin-top: 8px; transition: all .15s; }
.cap-srt:hover { border-color: var(--accent); color: #fff; }
.cap-note { font-size: 9px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
</style>
</head>

// ======================= STATE =======================
var currentTab = 'pro';

function getFavs() {
  try { return JSON.parse(localStorage.getItem('nytvir_favs') || '[]'); } catch(e) { return []; }
}
function setFavs(f) { try { localStorage.setItem('nytvir_favs', JSON.stringify(f)); } catch(e) {} }
function isFav(id) { return getFavs().indexOf(id) > -1; }
function toggleFav(id) {
  var f = getFavs(); var i = f.indexOf(id);
  if (i > -1) f.splice(i, 1); else f.push(id);
  setFavs(f);
}

// ======================= RENDERING =======================
function cardHTML(e, showTabChip) {
  if (e.tab === 'lib') return libCardHTML(e);
  var fav = isFav(e.id);
  var html = '<div class="card" data-id="' + e.id + '">';
  if (e.curve) {
    html += '<div class="jthumb"><svg width="100" height="50" viewBox="0 0 100 50"><path d="' + e.curve.path + '" stroke="' + e.curve.color + '" stroke-width="3" fill="none"/><circle cx="0" cy="48" r="3" fill="' + e.curve.color + '"/><circle cx="100" cy="2" r="3" fill="' + e.curve.color + '"/></svg>';
  } else {
    html += '<div class="thumb" style="background:' + e.bg + ';">' + e.icon;
  }
  html += '<div class="play-hint"><button class="apply-btn">Apply</button></div></div>';
  html += '<div class="fav' + (fav ? ' on' : '') + '" data-fav="' + e.id + '">' + (fav ? '★' : '☆') + '</div>';
  if (showTabChip) html += '<div class="tab-chip">' + (TAB_TITLES[e.tab] || e.tab).replace(/^[^A-Za-z⭐]*/, '') + '</div>';
  html += '<div class="cinfo"><div class="ctitle">' + e.title + '</div><div class="cdesc">' + e.desc + '</div></div></div>';
  return html;
}

function renderCards(list, showTabChip) {
  if (!list.length) return '';
  // group by section preserving order
  var html = '', lastSec = null, open = false;
  list.forEach(function(e) {
    if (e.sec !== lastSec) {
      if (open) html += '</div>';
      html += '<div class="sec-label">' + (e.sec || '') + '</div><div class="grid">';
      lastSec = e.sec; open = true;
    }
    html += cardHTML(e, showTabChip);
  });
  if (open) html += '</div>';
  return html;
}

function renderTab(tab) {
  currentTab = tab;
  document.getElementById('topbar-title').innerText = TAB_TITLES[tab] || tab;
  document.querySelectorAll('.nav').forEach(function(n) {
    n.classList.toggle('active', n.getAttribute('data-tab') === tab);
  });
  var c = document.getElementById('content');

  if (tab === 'edit') {
    c.innerHTML = '<div id="edit-content"></div>';
    loadControls();
    return;
  }

  if (tab === 'caption') {
    renderCaptionStudio(c);
    return;
  }

    renderLib(c);
    return;
  }

  if (tab === 'favs') {
    var favs = FX.filter(function(e) { return isFav(e.id); });

    var items = favs.map(function(e) { var copy = {}; for (var k in e) copy[k] = e[k]; copy.sec = 'Saqlangan effektlar'; return copy; });

  var card = ev.target.closest ? ev.target.closest('.card[data-id]') : null;
  if (card) {
    var id = card.getAttribute('data-id');

    FX.forEach(function(x) { if (x.id === id) e = x; });

function loadControls() {
  var ec = document.getElementById('edit-content');
  if (!ec) return;
  ec.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">Loading layer data...</div></div>';
  if (!cs) {
    ec.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Only works inside After Effects.</div></div>';
    return;
  }
  cs.evalScript('nytvir_getControls()', function(res) {
    try {
      var data = JSON.parse(res);
      if (data.error) {
        ec.innerHTML = '<div class="empty"><div class="empty-icon">🎛️</div><div class="empty-text">' + data.error + '</div><br><button class="edit-refresh" onclick="loadControls()" style="padding:8px 20px;font-size:10px;">🔄 Refresh</button></div>';
        return;
      }
      var html = '';
      html += '<div class="edit-header"><div><div style="font-size:9px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:1px;">Active Layer</div><div class="edit-layer-name">' + data.layerName + '</div></div><button class="edit-refresh" onclick="loadControls()">🔄 Refresh</button></div>';

      var hasCurve = data.controls.some(function(c) { return c.name === 'Curve Type'; });
      if (hasCurve) {
        html += '<div class="ctrl-block"><div class="curve-title">📉 Animation Curve</div><div class="curves-grid">';
        var curveVal = 1;
        data.controls.forEach(function(c) { if (c.name === 'Curve Type') curveVal = Math.round(c.value); });
        CURVES.forEach(function(cv) {
          var isActive = (curveVal === cv.val);
          html += '<div class="curve-card' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'border-color:' + cv.color + ';' : '') + '" onclick="updateControl(\'Curve Type\',\'slider\',' + cv.val + ');setTimeout(loadControls,300);">';
          html += '<svg width="100%" height="28" viewBox="0 0 100 50" preserveAspectRatio="none"><path d="' + cv.path + '" stroke="' + cv.color + '" stroke-width="4" fill="none"/></svg>';
          html += '<div class="curve-lbl" style="' + (isActive ? 'color:' + cv.color + ';' : '') + '">' + cv.name + '</div></div>';
        });
        html += '</div></div>';
      }

      data.controls.forEach(function(c) {
        if (c.name === 'Curve Type') return;
        html += '<div class="ctrl-block">';
        if (c.type === 'slider' && (c.name === 'Target' || c.name.indexOf('Multiplier') > -1)) {
          // free numeric entry — sliders can't reach millions
          html += '<div class="ctrl-label"><span class="ctrl-name">' + c.name + '</span></div>';
          html += '<input type="number" class="ctrl-num" min="0" step="1" value="' + parseFloat(c.value) + '" onchange="updateControl(\'' + c.name.replace(/'/g, "\\'") + '\',\'slider\',this.value)">';
        } else if (c.type === 'slider') {
          var max = 300;
          if (c.name.indexOf('Power') > -1 || c.name.indexOf('Width') > -1 || c.name.indexOf('Distance') > -1 || c.name.indexOf('Height') > -1) max = 2000;
          if (c.name.indexOf('Angle') > -1) max = 720;
          if (c.name.indexOf('Gooey') > -1 || c.name.indexOf('Strength') > -1 || c.name.indexOf('Size') > -1) max = 200;
          if (c.name.indexOf('Count') > -1 || c.name.indexOf('Spacing') > -1 || c.name.indexOf('Petals') > -1 || c.name.indexOf('Rows') > -1 || c.name.indexOf('Cols') > -1 || c.name.indexOf('Depth') > -1) max = 60;
          if (c.name.indexOf('Speed') > -1 && c.name.indexOf('Transition') === -1 && c.name.indexOf('Animation') === -1) max = 60;
          var sid = 'v' + c.name.replace(/[^a-zA-Z0-9]/g, '');
          html += '<div class="ctrl-label"><span class="ctrl-name">' + c.name + '</span><span class="ctrl-val" id="' + sid + '">' + parseFloat(c.value).toFixed(1) + '</span></div>';
          html += '<input type="range" min="0" max="' + max + '" step="0.5" value="' + Math.min(parseFloat(c.value), max) + '" oninput="document.getElementById(\'' + sid + '\').innerText=parseFloat(this.value).toFixed(1);updateControl(\'' + c.name.replace(/'/g, "\\'") + '\',\'slider\',this.value)">';
        } else if (c.type === 'color') {
          html += '<div class="ctrl-label"><span class="ctrl-name">' + c.name + '</span></div>';
          html += '<input type="color" value="' + c.value + '" oninput="updateControl(\'' + c.name.replace(/'/g, "\\'") + '\',\'color\',this.value)">';
        }
        html += '</div>';
      });

      if (data.controls.filter(function(c) { return c.name !== 'Curve Type'; }).length === 0) {
        html += '<div class="empty"><div class="empty-text">Bu qatlamda qo\'shimcha sozlamalar yo\'q.</div></div>';
      }

      ec.innerHTML = html;
    } catch(e) {
      ec.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">Parse error. [Nytvir] qatlamini tanlang.</div><br><button class="edit-refresh" onclick="loadControls()">🔄 Refresh</button></div>';
    }
  });
}

function updateControl(name, type, val) {
  if (cs) cs.evalScript('nytvir_setControl("' + name.replace(/"/g, '\\"') + '","' + type + '","' + val + '")');
}

// ======================= INIT =======================
renderTab('pro');
</script>
